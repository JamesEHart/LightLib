import org.gradle.internal.os.OperatingSystem

plugins {
    id 'java-library'
    id 'maven-publish'
}

// Bump this (and the versions in LightLogger.json) for every release.
group = 'io.github.jamesehart.lightlogger'
version = '2026.1.0'

def wpilibVersion = '2026.2.1'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
    withJavadocJar()
}

// The local WPILib install's maven folder, so builds work offline.
def frcHomeMaven
if (OperatingSystem.current().isWindows()) {
    frcHomeMaven = new File(System.getenv('PUBLIC') ?: 'C:\\Users\\Public', 'wpilib/2026/maven')
} else {
    frcHomeMaven = new File(System.getProperty('user.home'), 'wpilib/2026/maven')
}

repositories {
    maven { url = frcHomeMaven }
    maven { url = 'https://frcmaven.wpi.edu/artifactory/release/' }
    mavenCentral()
}

// compileOnly: the robot project already provides WPILib at runtime, so the
// published jar must not bundle or pin its own copy.
dependencies {
    compileOnly "edu.wpi.first.wpilibj:wpilibj-java:$wpilibVersion"
    compileOnly "edu.wpi.first.ntcore:ntcore-java:$wpilibVersion"
    compileOnly "edu.wpi.first.wpimath:wpimath-java:$wpilibVersion"
    compileOnly "edu.wpi.first.wpiutil:wpiutil-java:$wpilibVersion"
    compileOnly "edu.wpi.first.wpiunits:wpiunits-java:$wpilibVersion"
}

javadoc {
    options.addStringOption('Xdoclint:all,-missing', '-quiet')
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'lightlogger-java'
            from components.java
        }
    }
    repositories {
        // Published into the repo itself; GitHub serves it as the vendordep's maven URL.
        maven {
            name = 'repo'
            url = layout.projectDirectory.dir('repos')
        }
    }
}
