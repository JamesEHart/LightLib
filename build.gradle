import org.gradle.internal.os.OperatingSystem

// Shared setup for every LightLib library (lightlogger, lightsim, lightutil).
// Bump a library's version in its own build.gradle, and in its vendordep JSON, for every release.

ext.wpilibVersion = '2026.2.1'

// The local WPILib install's maven folder, so builds work offline.
def frcHomeMaven
if (OperatingSystem.current().isWindows()) {
    frcHomeMaven = new File(System.getenv('PUBLIC') ?: 'C:\\Users\\Public', 'wpilib/2026/maven')
} else {
    frcHomeMaven = new File(System.getProperty('user.home'), 'wpilib/2026/maven')
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        withSourcesJar()
        withJavadocJar()
    }

    repositories {
        maven { url = frcHomeMaven }
        maven { url = 'https://frcmaven.wpi.edu/artifactory/release/' }
        mavenCentral()
    }

    // compileOnly: the robot project already provides WPILib at runtime, so the
    // published jars must not bundle or pin their own copy.
    dependencies {
        compileOnly "edu.wpi.first.wpilibj:wpilibj-java:$wpilibVersion"
        compileOnly "edu.wpi.first.ntcore:ntcore-java:$wpilibVersion"
        compileOnly "edu.wpi.first.wpimath:wpimath-java:$wpilibVersion"
        compileOnly "edu.wpi.first.wpiutil:wpiutil-java:$wpilibVersion"
        compileOnly "edu.wpi.first.wpiunits:wpiunits-java:$wpilibVersion"
        compileOnly 'com.fasterxml.jackson.core:jackson-annotations:2.19.2'
    }

    javadoc {
        options.addStringOption('Xdoclint:all,-missing', '-quiet')
    }

    publishing {
        repositories {
            // Published into the repo itself; GitHub serves it as the vendordeps' maven URL.
            maven {
                name = 'repo'
                url = rootProject.layout.projectDirectory.dir('repos')
            }
        }
    }
}
