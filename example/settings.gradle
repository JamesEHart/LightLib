import org.gradle.internal.os.OperatingSystem

pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        String frcYear = '2026'
        File frcHome
        if (OperatingSystem.current().isWindows()) {
            String publicFolder = System.getenv('PUBLIC')
            if (publicFolder == null) {
                publicFolder = "C:\\Users\\Public"
            }
            def homeRoot = new File(publicFolder, "wpilib")
            frcHome = new File(homeRoot, frcYear)
        } else {
            def userFolder = System.getProperty("user.home")
            def homeRoot = new File(userFolder, "wpilib")
            frcHome = new File(homeRoot, frcYear)
        }
        def frcHomeMaven = new File(frcHome, 'maven')
        maven {
            name = 'frcHome'
            url = frcHomeMaven
        }
    }
}

// Build LightLogger, LightSim and LightUtil from the parent folder instead of downloading the published
// versions named in vendordeps/, so local changes are testable.
includeBuild('..') {
    dependencySubstitution {
        substitute module('io.github.jamesehart.lightlogger:lightlogger-java') using project(':lightlogger')
        substitute module('io.github.jamesehart.lightsim:lightsim-java') using project(':lightsim')
        substitute module('io.github.jamesehart.lightutil:lightutil-java') using project(':lightutil')
    }
}

Properties props = System.getProperties();
props.setProperty("org.gradle.internal.native.headers.unresolved.dependencies.ignore", "true");
